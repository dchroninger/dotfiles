# Ghostty launches tmux from the Dock env (no brew on PATH); plugins call `tmux`/`git`
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # true color
set -g focus-events on               # nvim autoread
set -g base-index 1
set -g renumber-windows on
set -g history-limit 50000
# let ghostty background image show through panes
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

# # remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# VIM TMUX NAVIGATOR
set -g @plugin 'christoomey/vim-tmux-navigator'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# CATPPUCCIN THEME (tpm-managed, pinned) — styled to match starship: rounded caps, angle joints
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background 'none'          # transparent bar, wallpaper shows through

# windows (left):   number  name 
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_number ' #I '
set -g @catppuccin_window_text ' #W '
set -g @catppuccin_window_current_number ' #I '
set -g @catppuccin_window_current_text ' #W '
set -g @catppuccin_window_number_color '#{@thm_overlay_1}'
set -g @catppuccin_window_text_color '#{@thm_surface_0}'
set -g @catppuccin_window_current_number_color '#{@thm_mauve}'
set -g @catppuccin_window_current_text_color '#{@thm_surface_1}'
set -g @catppuccin_window_left_separator '#[fg=#{@catppuccin_window_number_color},bg=default]#[fg=#{@thm_crust},bg=#{@catppuccin_window_number_color}]'
set -g @catppuccin_window_current_left_separator '#[fg=#{@catppuccin_window_current_number_color},bg=default]#[fg=#{@thm_crust},bg=#{@catppuccin_window_current_number_color}]'
set -g @catppuccin_window_middle_separator '#[fg=#{@catppuccin_window_number_color},bg=#{@catppuccin_window_text_color}]'
set -g @catppuccin_window_current_middle_separator '#[fg=#{@catppuccin_window_current_number_color},bg=#{@catppuccin_window_current_text_color}]'
set -g @catppuccin_window_right_separator '#[fg=#{@catppuccin_window_text_color},bg=default] '
set -g @catppuccin_window_current_right_separator '#[fg=#{@catppuccin_window_current_text_color},bg=default] '

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# theme must load before status-right references its vars
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# status right: one connected chain like starship — blue  mauve  pink  teal
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#[fg=#{@thm_blue},bg=default]#[fg=#{@thm_crust},bg=#{@thm_blue}] 󰆍 #{pane_current_command} "
set -ag status-right "#[fg=#{@thm_blue},bg=#{@thm_mauve}]#[fg=#{@thm_crust},bg=#{@thm_mauve}]  #{cpu_percentage} "
set -ag status-right "#[fg=#{@thm_mauve},bg=#{@thm_pink}]#[fg=#{@thm_crust},bg=#{@thm_pink}]  #S "
set -ag status-right "#[fg=#{@thm_pink},bg=#{@thm_teal}]#[fg=#{@thm_crust},bg=#{@thm_teal}] #{battery_icon} #{battery_percentage} "
set -ag status-right "#[fg=#{@thm_teal},bg=default]"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
